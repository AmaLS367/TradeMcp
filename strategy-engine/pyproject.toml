[project]
name = "strategy-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ama", email = "ama@amadev.tech" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.128.8",
    "jesse>=3.1.3",
    "numpy>=1.26.4",
    "pandas>=2.2.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.40.0",
]

[project.scripts]
strategy-engine = "strategy_engine:main"

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "engine"

[dependency-groups]
dev = [
    "import-linter>=2.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires real Postgres and Jesse (deselected by default)",
]
addopts = "-m 'not integration'"

[tool.uv]
override-dependencies = [
    "pytest>=8.3.0",
]
